name: checks

on:
  push:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install pytest
        run: pip install pytest
      - name: test
        run: pytest

  lint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install development tools
        run: pip install pylint pytest mypy
      - name: lint
        run: pylint --recursive y .
      - name: typecheck
        run: mypy .

  coverage:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install development tools
        run: pip install pytest pytest-cov
      - name: test with coverage
        run: pytest --cov --cov-report=xml:coverage_cobertura.xml --cov-report=html:coverage_html
      - name: install coverage badge dependencies
        run: sudo apt-get install -y xsltproc
      - name: generate coverage badge
        run: xsltproc -o coverage_html/badge.svg tests/coverage/cobertura2svg.xslt coverage_cobertura.xml
      - name: upload code coverage artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './coverage_html'
      - name: Deploy code coverage site
        id: deployment
        uses: actions/deploy-pages@v5
